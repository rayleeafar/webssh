services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      DATABASE_PATH: /data/webssh.db
      MASTER_SECRET: ${MASTER_SECRET:?MASTER_SECRET must be set}
      ENABLE_TLS: ${ENABLE_TLS:-false}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
