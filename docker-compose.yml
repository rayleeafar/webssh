services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      DB_PATH: /data/webssh.db
      MASTER_SECRET: ${MASTER_SECRET:?MASTER_SECRET must be set}
      ENABLE_TLS: ${ENABLE_TLS:-false}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_API_URL is baked into the client bundle at build time.
        # Set this to the public URL of the backend (e.g. http://yourhost:8080).
        # Defaults to empty string for same-origin proxy via a reverse proxy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # NEXT_PUBLIC_WS_URL sets the WebSocket base URL baked into the bundle.
        # Next.js rewrites() do NOT proxy WebSocket upgrades, so this must point
        # directly at the backend when not using a reverse proxy (e.g. nginx).
        # Default: ws://localhost:8080 matches the exposed backend port above.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
